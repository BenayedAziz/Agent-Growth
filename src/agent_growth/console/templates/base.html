<!doctype html>
<html lang="fr" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Console{% endblock %} — Agent Growth</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { darkMode: 'media', theme: { extend: { fontFamily: {
    sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
    mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
  }}}}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

<header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
  <div class="mx-auto max-w-6xl px-4 py-3 flex items-center gap-6 flex-wrap">
    <a href="/" class="font-semibold tracking-tight">Agent&nbsp;Growth</a>
    <nav class="flex gap-4 text-sm text-slate-600 dark:text-slate-400">
      <a href="/" class="hover:text-teal-700 dark:hover:text-teal-400">Portefeuille</a>
      <a href="/validations" class="hover:text-teal-700 dark:hover:text-teal-400">Validations</a>
      <a href="/outils" class="hover:text-teal-700 dark:hover:text-teal-400">Outils</a>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  {% block content %}{% endblock %}
</main>

<footer class="mx-auto max-w-6xl px-4 py-8 text-xs text-slate-500">
  Console locale. Les données clients vivent dans <code class="num">brands/</code>, hors de Git.
</footer>
</body>
</html>
